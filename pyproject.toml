[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ledger"
version = "0.1.0"
description = "LeadMode: turn tickets into planned, delegated, verified agent work"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "agent-ledger contributors"}]
keywords = ["agents", "claude-code", "sqlite", "coordination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.scripts]
agent-ledger = "agent_ledger.cli:main"
agent-ledger-dashboard = "agent_ledger.dashboard:main"
agent-ledger-hook = "agent_ledger.hooks:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_ledger = ["assets/skills/*/SKILL.md"]
